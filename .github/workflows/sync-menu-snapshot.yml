name: Sync menu snapshot

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jbg-menu-snapshot
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build current menu snapshot
        run: python3 scripts/update_menu_snapshot.py

      - name: Commit only when menu changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No menu changes."
            exit 0
          fi
          git config user.name "jbg-menu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Sync menu snapshot from Loyverse"
          git push
